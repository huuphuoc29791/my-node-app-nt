name: Node.js CI

on:
    push:
        branches:
            - main
            - develop

    pull_request:
        branches:
            - main

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check syntax
              run: node --check app.js

            - name: Build
              run: npm run build --if-present

            - name: Run tests
              run: npm test --if-present
